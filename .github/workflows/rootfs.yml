name: Build iOS 16 RootFS (Sparse Image)

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev \
            hfsprogs rsync android-sdk-libsparse-utils curl unzip python3

      - name: Build and install apfs-fuse
        run: |
          git clone https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cd /tmp/apfs-fuse
          git submodule update --init
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          which apfs-fuse

      - name: Download Apple iPhone X iOS 16.7.16 IPSW
        run: |
          mkdir -p /tmp/ipsw
          cd /tmp/ipsw
          echo "Downloading iOS 16.7.16 IPSW from Apple CDN..."
          curl -Lo ios16.ipsw "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          ls -lh ios16.ipsw

      - name: Extract DMGs from IPSW
        run: |
          cd /tmp/ipsw
          unzip ios16.ipsw "087-86698-044.dmg" "087-86593-047.dmg" "087-86715-047.dmg"
          mv 087-86698-044.dmg OS.dmg
          mv 087-86593-047.dmg SystemOS.dmg
          mv 087-86715-047.dmg AppOS.dmg
          rm -f ios16.ipsw
          ls -lh *.dmg

      - name: Build iOS 16 HFS+ Root Image
        run: |
          chmod +x tools/mkiosroot.sh
          mkdir -p out
          ./tools/mkiosroot.sh /tmp/ipsw/OS.dmg /tmp/ipsw/SystemOS.dmg /tmp/ipsw/AppOS.dmg out/ios16-root.img 14G
          rm -rf /tmp/ipsw

      - name: Apply LG V30 bring-up tweaks
        run: |
          sudo fsck.hfsplus -fy out/ios16-root.img || true
          mkdir -p /tmp/iosroot
          sudo mount -t hfsplus -o loop,force out/ios16-root.img /tmp/iosroot
          sudo python3 tools/sweet-root-tweaks.py /tmp/iosroot
          sudo umount /tmp/iosroot

      - name: Convert to Android Sparse Image (img2simg) and compress
        run: |
          img2simg out/ios16-root.img out/ios16-root.simg
          rm -f out/ios16-root.img
          ls -lh out/ios16-root.simg
          gzip -1 out/ios16-root.simg
          ls -lh out/

      - name: Upload iOS 16 RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-rootfs-simg
          path: out/ios16-root.simg.gz
          retention-days: 7
