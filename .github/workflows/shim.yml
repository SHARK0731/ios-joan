name: Build Shim Boot Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'shim/**'
      - '.github/workflows/shim.yml'

jobs:
  build-shim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc python3 python3-pip
          pip3 install --break-system-packages mkbootimg lzfse pyasn1 || pip3 install mkbootimg lzfse pyasn1 || sudo apt-get install -y mkbootimg

      - name: Download XNU kernel artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p xnu/out
          gh run download 43589408306 -R ${{ github.repository }} -n xnu-kernel -D xnu/out
          ls -la xnu/out/

      - name: Build Joan ADT and Payload
        run: |
          mkdir -p shim/out
          python3 tools/mkadt.py shim/out/joan.adt --highmem
          python3 tools/mkpayload.py xnu/out/kernel.development.sweet shim/out/joan.adt shim/out/payload.bin \
            --cmdline "debug=0xc serial=3 cpus=4 keepsyms=1 -enable_kprintf_spam -noprogress rd=ufsroot0 unentitled_ios_sim_launch=1 ignition_level=1 wdt_test=no_user_checkin ufsrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 sweetfb_noconsole=1 sweetfb_hz=30 sweettouch=0 sweetkeys=0"
          ls -la shim/out/

      - name: Build Shim and Pack Boot Image
        run: |
          chmod +x shim/build.sh
          # Run shim build
          ./shim/build.sh shim/out/payload.bin
          ls -la shim/out/

      - name: Upload Shim Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: shim-boot-image
          path: |
            shim/out/shim-boot.img
            shim/out/Image
            shim/out/payload.bin
            shim/out/joan.adt
